[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgep"
version = "0.9.0"
authors = [
    {name = "Adrien Leroy"},
    {name = "Lorette Noiret"},
]
description = "Virtual Gene Expression Patterns (vGEP) - spatial transcriptomics analysis toolkit"
readme = "README.md"
requires-python = ">=3.10, <3.14"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # Core data handling
    "numpy>=1.25,<2",
    "pandas>=2.0.0",
    "scipy",

    # Single-cell data formats
    "anndata>=0.10.5",
    "mudata>=0.2.3",
    "zarr>=2.16.0",
    "scanpy>=1.10.0",

    # Analysis tools
    "statsmodels>=0.14.0",
    "networkx>=3.0.0",
    "igraph>=0.11.0",
    "leidenalg>=0.10.0",
    "tspex>=0.6.0",

    # Spatial reconstruction backends used by optimization._novosparc / _perler.
    # PERLER is not on PyPI (install from source if needed).
    "novosparc>=0.4.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Utilities
    "tqdm>=4.64.0",
]

[project.urls]
"Homepage" = "https://github.com/BellaicheLab/vgep"
"Bug Tracker" = "https://github.com/BellaicheLab/vgep/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<8.3.0",
    "pytest-cov>=5.0.0,<5.1.0",
]
docs = [
    "sphinx>=7.0,<9",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=2.0",
    "nbsphinx>=0.9",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "ipython>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
